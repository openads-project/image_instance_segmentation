services:

  image-instance-segmentation:
    image: ghcr.io/openads-project/image_instance_segmentation:v1.1.0
    environment:
      # --- name ------
      NAMESPACE: /
      NAME: image_instance_segmentation
      # --- other -----
      DIAGNOSTICS_TOPIC: /diagnostics
      IMAGE_TOPIC: ~/image
      CLASS_MASK_TOPIC: ~/segmentation/class_mask
      INSTANCE_MASK_TOPIC: ~/segmentation/instance_mask
      DETECTIONS_TOPIC: ~/segmentation/detections
      ROAD_USERS_TOPIC: ~/perception/road_users
      TRAFFIC_LIGHTS_TOPIC: ~/perception/traffic_lights
      TRAFFIC_SIGNS_TOPIC: ~/perception/traffic_signs
      CLASS_OVERLAY_TOPIC: ~/debug/overlay/class
      INSTANCE_OVERLAY_TOPIC: ~/debug/overlay/instance
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USE_SIM_TIME: ${USE_SIM_TIME:-false}
      PARAMS: /docker-ros/ws/install/image_instance_segmentation/share/image_instance_segmentation/config/params.yml
      ROS_TRACING: ${ROS_TRACING:-false}
      TRITON_SERVER_URL: triton-server:8001
    command:
      - /bin/bash
      - -ic
      - |
        ros2 launch image_instance_segmentation image_instance_segmentation.launch.py \
          namespace:=$${NAMESPACE} \
          name:=$${NAME} \
          log_level:=$${LOG_LEVEL} \
          use_sim_time:=$${USE_SIM_TIME} \
          params:=$${PARAMS} \
          ros_tracing:=$${ROS_TRACING} \
          triton_server_url:=$${TRITON_SERVER_URL} \
          diagnostics_topic:=$${DIAGNOSTICS_TOPIC} \
          image_topic:=$${IMAGE_TOPIC} \
          class_mask_topic:=$${CLASS_MASK_TOPIC} \
          instance_mask_topic:=$${INSTANCE_MASK_TOPIC} \
          detections_topic:=$${DETECTIONS_TOPIC} \
          road_users_topic:=$${ROAD_USERS_TOPIC} \
          traffic_lights_topic:=$${TRAFFIC_LIGHTS_TOPIC} \
          traffic_signs_topic:=$${TRAFFIC_SIGNS_TOPIC} \
          class_overlay_topic:=$${CLASS_OVERLAY_TOPIC} \
          instance_overlay_topic:=$${INSTANCE_OVERLAY_TOPIC}
    # volumes:
    #   - ./params.yml:/docker-ros/ws/install/image_instance_segmentation/share/image_instance_segmentation/config/params.yml
